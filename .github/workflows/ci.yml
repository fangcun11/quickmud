name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建（tsc + esbuild 双格式）
        run: pnpm build

      - name: 单元测试
        run: pnpm test

      - name: 契约测试（ESM / CJS / TS strict）
        run: pnpm test:contract

      - name: 文档示例双验证
        run: node docs/examples/verify-doc-examples.mjs

      - name: Lint
        run: pnpm lint
